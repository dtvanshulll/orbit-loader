<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraceLoop examples</title>
<link rel="stylesheet" href="../src/css/base.css">
<link rel="stylesheet" href="../src/css/dot.css">
<link rel="stylesheet" href="../src/css/shimmer.css">
<link rel="stylesheet" href="../src/css/ripple.css">
<link rel="stylesheet" href="../src/css/dot-ghosts.css">
<link rel="stylesheet" href="../src/css/typing.css">
<link rel="stylesheet" href="../src/css/transitions.css">
<link rel="stylesheet" href="../src/css/search.css">
<link rel="stylesheet" href="../src/css/modal.css">
<link rel="stylesheet" href="../src/css/drawer.css">
<link rel="stylesheet" href="../src/css/accordion.css">
<link rel="stylesheet" href="../src/css/dropdown.css">
<link rel="stylesheet" href="../src/css/input.css">
<link rel="stylesheet" href="../src/css/page-variants.css">
<style>
  body { background: #fff; color: #222; font: 15px/1.5 system-ui, sans-serif; padding: 48px; display: flex; gap: 64px; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; color: #d97757; }
  figcaption { margin-top: 16px; color: #666; font-size: 13px; }
  .logo-box { width: 84px; height: 84px; border-radius: 24px; background: #201f1c; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .circle-box { width: 72px; height: 72px; }
  .infinity-box { width: 120px; height: 60px; background: #000; border: 1px solid #3a3831; border-radius: 16px; }
  .letter-box { width: 36px; height: 60px; }
  .alphabet-box { background: #e8e6dc; border-radius: 6px; }

  .ripple-box { width: 72px; height: 72px; color: #d97757; }
  .typing-box { width: 110px; height: 44px; color: #d97757; }
  .alphabet-box { background: #e8e6dc; border-radius: 6px; }
  .text-box { font-size: 20px; font-weight: 600; color: #222; }
  .underline-strip { width: 100%; height: 10px; margin-top: 2px; }
  .boxed-text { font-size: 20px; font-weight: 600; color: #222; padding: 10px 14px; }
  .letter-outline-box { }
</style>
</head>
<body>

<figure>
  <div class="orbit-loader-wrap logo-box" id="logo-demo"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#e8e6dc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.296 3.464l3.02 3.956M20.2 6L3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3zM3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zm3.18-5.724l3.1 3.899"/></svg></div>
  <figcaption>roundedSquare(84, 24)</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap circle-box" id="circle-demo"></div>
  <figcaption>circle(72) &middot; offset 6 &middot; strokeWidth 3</figcaption>
</figure>

<figure>
  <div class="text-box">Loading<div class="orbit-loader-wrap underline-strip" id="text-demo"></div></div>
  <figcaption>underline(80, 3) under text</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap letter-box" id="letter-demo"></div>
  <figcaption>letter("S", 60) — along the stroke</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap letter-outline-box" id="letter-outline-demo"></div>
  <figcaption>letterOutline("A", 60) — outer surface only</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap alphabet-box" id="alphabet-demo"></div>
  <figcaption>text("A&ndash;Z") &middot; the line crawls letter by letter, in order</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap boxed-text" id="boxed-demo">Loading&hellip;</div>
  <figcaption>textBoxForElement(el, 8, 10) &middot; offset 8</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap infinity-box" id="infinity-demo"></div>
  <figcaption>ShimmerLoader &middot; infinity(120)</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap circle-box" id="dot-demo"></div>
  <figcaption>DotLoader &middot; circle(72) &middot; color</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap ripple-box" id="ripple-demo"></div>
  <figcaption>RippleLoader &middot; rings(3) &middot; grow and fade</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap circle-box" id="triangle-demo"></div>
  <figcaption>OrbitLoader &middot; polygon(3, 72) &middot; sharp triangle</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap circle-box" id="train-demo"></div>
  <figcaption>DotLoader &middot; polygon(6, 72, 6) &middot; dots(3) &middot; a train of dots</figcaption>
</figure>

<figure>
  <div class="orbit-loader-wrap typing-box" id="typing-demo"></div>
  <figcaption>TypingLoader &middot; the chat indicator</figcaption>
</figure>

<script src="../src/styles/orbit-loader.js"></script>
<script src="../src/styles/dot-loader.js"></script>
<script src="../src/styles/shimmer-loader.js"></script>
<script src="../src/styles/ripple-loader.js"></script>
<script src="../src/styles/typing-loader.js"></script>
<script src="../src/styles/handshake-loader.js"></script>
<script src="../src/styles/tab-loader.js"></script>
<script src="../src/styles/page-loader.js"></script>
<script src="../src/styles/button-loader.js"></script>
<script src="../src/styles/toast-loader.js"></script>
<script src="../src/styles/progress-loader.js"></script>
<script src="../src/styles/search-loader.js"></script>
<script src="../src/styles/modal-loader.js"></script>
<script src="../src/styles/accordion-loader.js"></script>
<script src="../src/styles/drawer-loader.js"></script>
<script src="../src/styles/dropdown-loader.js"></script>
<script src="../src/styles/input-loader.js"></script>
<script src="../src/shapes/shapes-core.js"></script>
<script src="../src/shapes/shapes-text.js"></script>
<script src="../src/shapes/shapes-outline.js"></script>
<script src="../src/shapes/outline-glyphs.js"></script>
<script>
  OrbitLoader.wrap(document.getElementById("logo-demo"), {
    d: OrbitLoader.shapes.roundedSquare(84, 24),
    viewBox: "0 0 84 84",
  });

  OrbitLoader.wrap(document.getElementById("circle-demo"), {
    d: OrbitLoader.shapes.circle(72),
    viewBox: "0 0 72 72",
    durationMs: 1600,
    offset: 6,
    strokeWidth: 3,
    guideOpacity: 0.35,
  });

  OrbitLoader.wrap(document.getElementById("text-demo"), {
    d: OrbitLoader.shapes.underline(80, 3),
    viewBox: "0 0 80 10",
    segmentFraction: 0.4,
    direction: "reverse",
    guideOpacity: 0.3,
  });

  OrbitLoader.wrap(document.getElementById("letter-demo"), {
    d: OrbitLoader.shapes.letter("S", 60),
    viewBox: "0 0 36 60",
    durationMs: 1800,
    segmentFraction: 0.3,
    guideOpacity: 0.35,
  });

  var aOutline = OrbitLoaderShapes.letterOutline("A", 60);
  var outlineEl = document.getElementById("letter-outline-demo");
  outlineEl.style.width = aOutline.width + "px";
  outlineEl.style.height = aOutline.height + "px";
  OrbitLoader.wrap(outlineEl, {
    d: aOutline.d,
    guideD: aOutline.guideD,
    viewBox: aOutline.viewBox,
    durationMs: 2600,
    segmentFraction: 0.45,
    guideOpacity: 0.35,
  });

  var alpha = OrbitLoaderShapes.text("ABCDEFGHIJKLMNOPQRSTUVWXYZ", 20, 6);
  var alphaEl = document.getElementById("alphabet-demo");
  alphaEl.style.width = alpha.width + "px";
  alphaEl.style.height = alpha.height + "px";
  OrbitLoader.wrap(alphaEl, {
    d: alpha.d,
    viewBox: alpha.viewBox,
    durationMs: 12000,
    segmentFraction: 0.06,
    guideOpacity: 0.3,
  });

  var box = OrbitLoaderShapes.textBoxForElement(document.getElementById("boxed-demo"), 8, 10);
  OrbitLoader.wrap(document.getElementById("boxed-demo"), {
    d: box.d,
    viewBox: box.viewBox,
    offset: 8,
    durationMs: 2600,
    guideOpacity: 0.35,
  });

  DotLoader.wrap(document.getElementById("dot-demo"), {
    d: OrbitLoaderShapes.circle(72),
    viewBox: "0 0 72 72",
    durationMs: 1600,
    color: "#788c5d",
    dotRadius: 4,
    guideOpacity: 0.35,
  });

  ShimmerLoader.wrap(document.getElementById("infinity-demo"), {
    d: OrbitLoaderShapes.infinity(120),
    viewBox: "0 0 120 60",
    durationMs: 2400,
    bandWidth: 10,
    bandOpacity: 0.5,
    color: "#e8e6dc",
  });

  RippleLoader.create(document.getElementById("ripple-demo"), {
    rings: 3,
    durationMs: 1800,
    strokeWidth: 3,
  });

  OrbitLoader.wrap(document.getElementById("triangle-demo"), {
    d: OrbitLoaderShapes.polygon(3, 72),
    viewBox: "0 0 72 72",
    durationMs: 1800,
    strokeWidth: 3,
    color: "#d97757",
    guideOpacity: 0.35,
  });

  DotLoader.wrap(document.getElementById("train-demo"), {
    d: OrbitLoaderShapes.polygon(6, 72, 6),
    viewBox: "0 0 72 72",
    durationMs: 2200,
    dots: 3,
    dotRadius: 3.5,
    color: "#6a9bcc",
    guideOpacity: 0.35,
  });

  TypingLoader.create(document.getElementById("typing-demo"), {
    dots: 3,
    durationMs: 1000,
    staggerMs: 180,
    color: "#d97757",
  });
</script>
</body>
</html>
