<!DOCTYPE html>
<!--
  TraceLoop — HandshakeLoader test harness (looping-loaders category).
  Covers: input guards, two-segment choreography (converge/flash/retract
  keyframe shapes), meetAt/overlap clamps, static-container fixup,
  caller-opacity preservation on destroy, guide, class overrides,
  reduced motion.
  Open in a browser; verdict lands in the page body and document.title.
-->
<html>
<head>
<meta charset="utf-8">
<title>HANDSHAKE TESTS: RUNNING</title>
<link rel="stylesheet" href="../dist/traceloop.css">
<style>
  body { font: 13px/1.5 monospace; background: #141413; color: #faf9f5; padding: 20px; }
  .pass { color: #788c5d; } .fail { color: #d97757; }
  .stage { width: 100px; height: 100px; background: #262420; border: 1px solid #33312c; margin: 10px 0; color: #788c5d; }
</style>
</head>
<body>
<div id="results">running…</div>
<div class="stage" id="s-main"></div>
<div class="stage" id="s-static" style="position: static"><span>static host</span></div>
<div class="stage" id="s-clamp"></div>
<div class="stage" id="s-guide"></div>
<div class="stage" id="s-destroy"></div>
<div class="stage" id="s-reduced"></div>

<script src="../src/styles/handshake-loader.js"></script>
<script src="../src/shapes/shapes-core.js"></script>
<script>
"use strict";
var results = [];
function check(n, ok, d) { results.push({ n: n, ok: !!ok, d: d || "" }); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function D(size) { return OrbitLoaderShapes.circle(size); }
function VB(size) { return "0 0 " + size + " " + size; }
function waapi(el) {
  return el.getAnimations().filter(function (a) { return a.transitionProperty == null; });
}

async function run() {
  /* 1 — input guards */
  var threw = "";
  try { HandshakeLoader.create(document.createElement("div"), {}); } catch (e) { threw = e.message; }
  check("create: non-path throws with clear message", threw.indexOf("SVG <path>") >= 0, threw);
  threw = "";
  try { HandshakeLoader.wrap("#nope", { d: D(72) }); } catch (e) { threw = e.message; }
  check("wrap: missing container throws", threw.indexOf("container not found") >= 0, threw);
  threw = "";
  try { HandshakeLoader.wrap("#s-main", {}); } catch (e) { threw = e.message; }
  check("wrap: missing d throws", threw.indexOf("options.d") >= 0, threw);

  /* 2 — choreography: two paths, two animations, mirrored keyframes */
  var h1 = HandshakeLoader.wrap("#s-main", { d: D(72), viewBox: VB(72), durationMs: 2000 });
  check("create: clone appended (two paths)", h1.paths.length === 2 &&
    h1.paths[1] !== h1.paths[0] && h1.paths[1].parentNode === h1.paths[0].parentNode);
  check("create: both paths at flash opacity 0.8",
    h1.paths[0].style.opacity === "0.8" && h1.paths[1].style.opacity === "0.8");
  h1.start();
  check("running: isRunning true", h1.isRunning());
  check("running: one WAAPI animation per path",
    waapi(h1.paths[0]).length === 1 && waapi(h1.paths[1]).length === 1);
  var kfA = waapi(h1.paths[0])[0].effect.getKeyframes();
  var kfB = waapi(h1.paths[1])[0].effect.getKeyframes();
  check("choreography: 5 keyframes (converge/flash/retract/rest/loop)", kfA.length === 5, "got " + kfA.length);
  // A anchors at offset 0 (path start); B anchors at -(total - L) (path end)
  var total = h1.paths[0].getTotalLength();
  var a0 = kfA[0].strokeDashoffset, b0 = kfB[0].strokeDashoffset;
  check("choreography: A starts at path start (offset 0)", parseFloat(a0) === 0, "" + a0);
  check("choreography: B anchored at the path end", Math.abs(parseFloat(b0) + total) < 1, "" + b0);
  // Peak: A grows to meetAt/2 + overlap/2, B mirrors — at the flash
  // keyframe their combined dasharray length exceeds the meet point.
  var peakA = kfA[2].strokeDasharray.split(" ")[0];
  check("choreography: A peaks past the midpoint (overlap push)",
    parseFloat(peakA) > total * 0.25, peakA);
  check("running: activeClass on both paths",
    h1.paths[0].classList.contains("is-active") && h1.paths[1].classList.contains("is-active"));
  h1.stop();
  check("stop: activeClass removed", !h1.paths[0].classList.contains("is-active"));

  /* 3 — meetAt/overlap clamps */
  var h2 = HandshakeLoader.wrap("#s-clamp", { d: D(72), viewBox: VB(72), meetAt: 2, overlap: -0.5, autoStart: false });
  h2.start();
  var kf2 = waapi(h2.paths[0])[0].effect.getKeyframes();
  var peak2 = parseFloat(kf2[2].strokeDasharray.split(" ")[0]);
  // meetAt clamped to 0.99: peak ≈ total*0.495 + push; overlap clamped
  // to 0 → peak ≈ total*0.495. Either way it must stay under total.
  check("meetAt=2, overlap=-0.5: clamped (peak < total, ≥ midpoint)",
    peak2 >= total * 0.45 && peak2 < total, peak2.toFixed(1));
  h2.stop(); h2.destroy();

  /* 4 — static container fixup */
  var host = document.getElementById("s-static");
  var h3 = HandshakeLoader.wrap(host, { d: D(72), viewBox: VB(72), autoStart: false });
  check("static host: forced to relative", getComputedStyle(host).position === "relative");
  h3.destroy();
  check("static host: position restored on destroy",
    host.style.position === "" && getComputedStyle(host).position === "static");

  /* 5 — guide + class overrides */
  var h4 = HandshakeLoader.wrap("#s-guide", {
    d: D(72), viewBox: VB(72), guideOpacity: 0.35,
    svgClassName: "my-svg", pathClassName: "my-path", autoStart: false
  });
  check("guide: rendered with requested opacity",
    !!h4.svg.querySelector(".orbit-loader-guide") &&
    h4.svg.querySelector(".orbit-loader-guide").style.opacity === "0.35");
  check("class overrides: honored",
    h4.svg.getAttribute("class") === "my-svg" && h4.path ? h4.paths[0].getAttribute("class") === "my-path" : false);
  h4.destroy();

  /* 6 — destroy: caller's own opacity preserved (was wiped before) */
  var hostEl = document.getElementById("s-destroy");
  hostEl.innerHTML = "<svg viewBox='0 0 72 72'><path id='hs-own' d='" + D(72) + "' style='opacity:0.45'/></svg>";
  var own = document.getElementById("hs-own");
  var h5 = HandshakeLoader.create(own, { color: "#788c5d", autoStart: false });
  h5.destroy();
  check("destroy: caller's own inline opacity restored", own.style.opacity === "0.45", own.style.opacity);
  check("destroy: clone removed", h5.paths[1].parentNode === null);
  check("destroy: color cleared", own.style.stroke === "");

  /* 7 — reduced motion: nothing runs */
  var realMM = window.matchMedia;
  window.matchMedia = function (q) { return { matches: q.indexOf("prefers-reduced-motion") >= 0, media: q, addListener: function(){}, removeListener: function(){}, addEventListener: function(){}, removeEventListener: function(){} }; };
  var h6 = HandshakeLoader.wrap("#s-reduced", { d: D(72), viewBox: VB(72) });
  check("reduced motion: no animations",
    waapi(h6.paths[0]).length === 0 && waapi(h6.paths[1]).length === 0);
  check("reduced motion: isRunning false", !h6.isRunning());
  h6.destroy();
  window.matchMedia = realMM;

  var pass = 0, fail = 0, html = "";
  for (var i = 0; i < results.length; i++) {
    if (results[i].ok) pass++; else fail++;
    html += '<div class="' + (results[i].ok ? "pass" : "fail") + '">' +
      (results[i].ok ? "PASS" : "FAIL") + " — " + results[i].n +
      (results[i].d ? " (" + results[i].d + ")" : "") + "</div>";
  }
  document.getElementById("results").innerHTML = html;
  document.title = fail === 0 ? "HANDSHAKE TESTS: PASS" : "HANDSHAKE TESTS: FAIL " + fail;
}
run();
</script>
</body>
</html>
